services:
  wallbox-controller:
    container_name: wallbox-controller
    build:
      context: .
      dockerfile: Containerfile 
    image: localhost/wallbox-controller:latest
    ports:
      - "8084:8084"
    environment:
      - TZ=Europe/Berlin
      - PROMETHEUS_METRICS_URL_INVERTER=http://192.168.1.4:2112/metrics
    volumes:
      - ~/app-data/wallbox-controller:/app/log:Z
    #userns_mode: keep-id
    restart: unless-stopped

    # Automated native Podman/Docker log rotation for standard terminal streams (fmt.Printf)
    logging:
      driver: k8s-file
      options:
        max-size: "10mb"
        max-file: "3"
